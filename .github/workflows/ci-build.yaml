
name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Lint and Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 nose coverage

      - name: Check project files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f

      - name: Lint with flake8
        run: |
          flake8 . --count --max-line-length=127 --statistics

      - name: Run unit tests with nosetests
        run: |
          python -c "import collections, collections.abc; collections.Callable = collections.abc.Callable; import nose; nose.main(argv=['nosetests', '-v'])"
