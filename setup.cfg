
[nosetests]
verbosity = 2
detailed-errors = 1
with-coverage = 1
cover-package = service
cover-erase = 1

[coverage:run]
branch = True
source = service
omit =
    tests/*
    */__init__.py

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 0

[flake8]
max-line-length = 127
exclude =
    .git,
    __pycache__,
    venv,
    .venv
statistics = True
count = True

[pylint]
max-line-length = 127
disable =
    C0114,
    C0115,
    C0116
